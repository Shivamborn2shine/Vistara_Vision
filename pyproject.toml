[project]
name = "vistara-vision"
version = "0.1.0"
description = "Voice-first assistive visual AI with teachable recognition and time-aware episodic memory."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "numpy>=2.1.0",
    "pillow>=11.0.0",
    "qrcode>=8.0",
    "python-multipart>=0.0.12",
    "websockets>=13.1",
]

[project.optional-dependencies]
vision = [
    "opencv-python-headless>=4.10.0.84",
    "onnxruntime>=1.19.2",
]
dev = [
    "pytest>=8.3.3",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["qrcode", "rapidocr_onnxruntime", "pytesseract"]
ignore_missing_imports = true
